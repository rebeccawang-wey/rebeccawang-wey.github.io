{% extends "base.html" %}
{% block title %}Contact — {{ site.name }}{% endblock %}
{% block main %}
{% set c = site.contact %}

<header class="page-head wrap">
  <h1>{{ c.title }}</h1>
  <p class="lead">{{ c.open_to }}</p>
</header>

<div class="page-body wrap">
  <ul class="contact-list">
    <li><span class="k">Email</span><span class="v"><a href="mailto:{{ site.email }}">{{ site.email }}</a></span></li>
    <li><span class="k">LinkedIn</span><span class="v"><a href="{{ site.linkedin_url }}" rel="me">{{ site.linkedin_label }}</a></span></li>
  </ul>
  <p class="contact-note">{{ c.note }}</p>
</div>

{% endblock %}
